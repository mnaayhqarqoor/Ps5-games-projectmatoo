<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>العد التنازلي الأخير - Face ID</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;400;700;900&family=Reem+Kufi+Fun:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- مكتبة MediaPipe لرسم شبكة الوجه -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<style>
  :root {
    --glass-bg: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --glass-blur: 40px;
    --blood: #a80000;
    --blood-glow: rgba(168,0,0,0.5);
    --bone: #e8ddd0;
    --bone-dim: rgba(232,221,208,0.5);
    --dark: #080608;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--dark);
    color: var(--bone);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* خلفية سائلة */
  .liquid-bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .liquid-orb {
    position:absolute; border-radius:50%; filter:blur(80px); opacity:0.4;
    animation: orbFloat 20s ease-in-out infinite;
  }
  .liquid-orb:nth-child(1) { width:400px;height:400px;background:radial-gradient(circle,rgba(140,0,0,0.5),rgba(80,0,0,0.2),transparent);top:-10%;right:-10%;animation-duration:18s; }
  .liquid-orb:nth-child(2) { width:300px;height:300px;background:radial-gradient(circle,rgba(100,0,0,0.4),rgba(50,0,20,0.2),transparent);bottom:10%;left:-5%;animation-duration:22s;animation-delay:-5s; }
  .liquid-orb:nth-child(3) { width:250px;height:250px;background:radial-gradient(circle,rgba(80,0,30,0.3),rgba(30,0,40,0.15),transparent);top:40%;left:50%;animation-duration:25s;animation-delay:-10s; }
  @keyframes orbFloat {
    0%,100%{transform:translate(0,0) scale(1);} 25%{transform:translate(40px,-30px) scale(1.1);}
    50%{transform:translate(-20px,50px) scale(0.95);} 75%{transform:translate(30px,20px) scale(1.05);}
  }

  .vignette { position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.6) 100%); }

  /* زجاج سائل */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
    border: 1px solid var(--glass-border);
    position: relative; overflow: hidden;
  }
  .glass::before {
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,transparent 40%,transparent 60%,rgba(255,255,255,0.03) 100%);
    pointer-events:none;
  }
  .glass::after {
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);pointer-events:none;
  }

  .app-container {
    position:relative;z-index:2;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 16px;
  }

  /* === شاشة الإدخال === */
  .screen { display:none; flex-direction:column;align-items:center;width:100%;max-width:420px; }
  .screen.active { display:flex; }

  .skull-orb {
    width:80px;height:80px;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(168,0,0,0.08);backdrop-filter:blur(30px);
    border:1px solid rgba(168,0,0,0.2);
    box-shadow:0 0 40px rgba(168,0,0,0.15),inset 0 0 30px rgba(168,0,0,0.05);
    animation:skullBreath 4s ease-in-out infinite;position:relative;
  }
  .skull-orb::before {
    content:'';position:absolute;inset:-2px;border-radius:50%;
    background:conic-gradient(from 0deg,transparent,rgba(168,0,0,0.3),transparent,rgba(168,0,0,0.15),transparent);
    animation:orbRotate 8s linear infinite;z-index:-1;filter:blur(4px);
  }
  @keyframes orbRotate { to{transform:rotate(360deg);} }
  @keyframes skullBreath {
    0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(168,0,0,0.15),inset 0 0 30px rgba(168,0,0,0.05);}
    50%{transform:scale(1.06);box-shadow:0 0 60px rgba(168,0,0,0.25),inset 0 0 40px rgba(168,0,0,0.08);}
  }
  .skull-orb i { font-size:32px;color:var(--blood);filter:drop-shadow(0 0 12px var(--blood-glow)); }

  .app-header { text-align:center;margin-bottom:28px;animation:fadeInDown 1s ease; }
  .app-header h1 {
    font-family:'Reem Kufi Fun',sans-serif;font-size:clamp(30px,7vw,44px);font-weight:700;
    color:var(--bone);text-shadow:0 0 40px var(--blood-glow);line-height:1.3;
  }
  .app-header .subtitle { font-size:13px;color:var(--bone-dim);margin-top:6px;font-weight:200;letter-spacing:3px; }

  .input-card {
    border-radius:28px;padding:28px 22px;width:100%;
    animation:fadeInUp 1s ease 0.2s both;
    box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 80px rgba(168,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .warning-text { text-align:center;font-size:13px;color:rgba(168,0,0,0.7);margin-bottom:24px;line-height:2; }
  .warning-text i { display:block;font-size:16px;margin-bottom:8px;color:var(--blood); }

  .form-group { margin-bottom:18px; }
  .form-group label { display:block;font-size:13px;color:var(--bone-dim);letter-spacing:1px;margin-bottom:8px;font-weight:700; }
  .form-group label i { margin-left:6px;color:var(--blood);font-size:12px; }

  .input-glass {
    width:100%;padding:14px 18px;background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.06);border-radius:16px;color:var(--bone);
    font-family:'Tajawal',sans-serif;font-size:16px;outline:none;
    transition:all 0.4s cubic-bezier(0.4,0,0.2,1);box-shadow:inset 0 2px 8px rgba(0,0,0,0.2);
  }
  .input-glass:focus { border-color:rgba(168,0,0,0.4);box-shadow:inset 0 2px 8px rgba(0,0,0,0.2),0 0 30px rgba(168,0,0,0.1);background:rgba(255,255,255,0.05); }
  .input-glass::placeholder { color:rgba(232,221,208,0.2); }
  .input-glass::-webkit-calendar-picker-indicator { filter:invert(0.7) sepia(1) hue-rotate(-30deg);cursor:pointer; }

  .reveal-btn {
    width:100%;padding:16px;border:1px solid rgba(168,0,0,0.3);border-radius:18px;
    color:var(--bone);font-family:'Reem Kufi Fun',sans-serif;font-size:20px;font-weight:700;
    cursor:pointer;position:relative;overflow:hidden;
    transition:all 0.4s cubic-bezier(0.4,0,0.2,1);margin-top:8px;
    background:rgba(168,0,0,0.12);backdrop-filter:blur(20px);
    box-shadow:0 8px 32px rgba(168,0,0,0.15),inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .reveal-btn::before { content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);transition:left 0.6s ease; }
  .reveal-btn:hover::before { left:100%; }
  .reveal-btn:hover { transform:translateY(-2px);box-shadow:0 12px 40px rgba(168,0,0,0.25);border-color:rgba(168,0,0,0.5);background:rgba(168,0,0,0.18); }
  .reveal-btn:active { transform:translateY(0) scale(0.98); }
  .reveal-btn:disabled { opacity:0.4;cursor:not-allowed;transform:none; }

  /* === شاشة Face ID === */
  .face-screen { gap:24px; }

  .camera-container {
    position:relative;width:280px;height:280px;border-radius:50%;overflow:hidden;
    box-shadow:0 0 60px rgba(168,0,0,0.15),inset 0 0 40px rgba(0,0,0,0.5);
    border:3px solid rgba(168,0,0,0.15);
    transition:border-color 0.6s, box-shadow 0.6s;
  }
  .camera-container.scanning {
    border-color:rgba(168,0,0,0.5);
    box-shadow:0 0 80px rgba(168,0,0,0.3),inset 0 0 40px rgba(0,0,0,0.5);
  }
  .camera-container.verified {
    border-color:rgba(0,200,80,0.5);
    box-shadow:0 0 80px rgba(0,200,80,0.2),inset 0 0 40px rgba(0,0,0,0.5);
  }
  .camera-container.failed {
    border-color:rgba(255,50,50,0.6);
    box-shadow:0 0 80px rgba(255,50,50,0.3),inset 0 0 40px rgba(0,0,0,0.5);
  }

  #webcam { width:100%;height:100%;object-fit:cover;transform:scaleX(-1); }
  #faceCanvas { position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none; }

  .scan-ring {
    position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
    border:2px solid transparent;
  }
  .scan-ring.active {
    border-top-color:var(--blood);border-right-color:rgba(168,0,0,0.3);
    animation:scanSpin 1.5s linear infinite;
  }
  .scan-ring.verified-ring {
    border-color:rgba(0,200,80,0.5);
    animation:none;
  }
  @keyframes scanSpin { to{transform:rotate(360deg);} }

  .face-status {
    text-align:center;font-size:15px;color:var(--bone-dim);min-height:24px;
    transition:color 0.3s;
  }
  .face-status.active-status { color:var(--blood); }
  .face-status.success-status { color:rgba(0,200,80,0.8); }
  .face-status.fail-status { color:rgba(255,80,80,0.8); }

  .face-instructions {
    font-size:12px;color:rgba(168,0,0,0.5);text-align:center;line-height:2;
  }

  .face-progress-track {
    width:200px;height:3px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden;
  }
  .face-progress-fill {
    height:100%;width:0%;background:linear-gradient(90deg,var(--blood),rgba(168,0,0,0.4));
    border-radius:10px;transition:width 0.3s ease;
  }
  .face-progress-fill.success-fill { background:linear-gradient(90deg,rgba(0,200,80,0.8),rgba(0,200,80,0.4)); }

  .skip-btn {
    padding:10px 28px;background:transparent;border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;color:var(--bone-dim);font-family:'Tajawal',sans-serif;
    font-size:13px;cursor:pointer;transition:all 0.3s ease;margin-top:8px;
  }
  .skip-btn:hover { border-color:rgba(168,0,0,0.3);color:var(--bone); }

  /* === شاشة التحميل === */
  .loading-screen { gap:28px;justify-content:center;min-height:50vh; }
  .loading-orb {
    width:100px;height:100px;border-radius:50%;background:rgba(168,0,0,0.06);
    backdrop-filter:blur(30px);border:1px solid rgba(168,0,0,0.15);
    display:flex;align-items:center;justify-content:center;position:relative;
    animation:loadPulse 2s ease-in-out infinite;
  }
  .loading-orb::before { content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;border-top-color:var(--blood);border-right-color:rgba(168,0,0,0.3);animation:orbRotate 2s linear infinite; }
  .loading-orb i { font-size:28px;color:var(--blood);filter:drop-shadow(0 0 15px var(--blood-glow));animation:loadIconSpin 4s linear infinite; }
  @keyframes loadPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes loadIconSpin { to{transform:rotate(360deg);} }

  .loading-bar-track { width:200px;height:3px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden; }
  .loading-bar-fill { height:100%;width:0%;background:linear-gradient(90deg,var(--blood),rgba(168,0,0,0.4));border-radius:10px;transition:width 0.4s ease; }

  /* === شاشة النتيجة === */
  .result-screen { gap:20px; }

  .result-icon-container {
    width:100px;height:100px;border-radius:50%;background:rgba(168,0,0,0.08);
    backdrop-filter:blur(30px);border:1px solid rgba(168,0,0,0.2);
    display:flex;align-items:center;justify-content:center;
    animation:iconReveal 1.2s cubic-bezier(0.34,1.56,0.64,1) both;
    box-shadow:0 0 60px rgba(168,0,0,0.2),inset 0 0 30px rgba(168,0,0,0.05);
    position:relative;
  }
  .result-icon-container::before { content:'';position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 30%,rgba(168,0,0,0.4) 50%,transparent 70%);animation:orbRotate 6s linear infinite;filter:blur(3px); }
  .result-icon-container i { font-size:40px;color:var(--blood);filter:drop-shadow(0 0 20px var(--blood-glow)); }
  @keyframes iconReveal { 0%{transform:scale(0) rotate(-180deg);opacity:0;} 60%{transform:scale(1.15) rotate(10deg);opacity:1;} 100%{transform:scale(1) rotate(0deg);} }

  .result-name { font-family:'Reem Kufi Fun',sans-serif;font-size:26px;font-weight:700;color:var(--bone);animation:fadeInUp 0.8s ease 0.3s both; }
  .result-label { font-size:13px;color:var(--bone-dim);letter-spacing:3px;font-weight:200;animation:fadeInUp 0.8s ease 0.4s both; }

  .death-date-glass {
    border-radius:24px;padding:28px 36px;text-align:center;width:100%;
    animation:fadeInUp 0.8s ease 0.5s both;
    box-shadow:0 16px 50px rgba(0,0,0,0.3),0 0 80px rgba(168,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .death-date-glass .date-text {
    font-family:'Reem Kufi Fun',sans-serif;font-size:clamp(26px,7vw,38px);font-weight:700;
    color:var(--blood);text-shadow:0 0 30px var(--blood-glow);position:relative;z-index:1;
  }

  .countdown-row { display:flex;gap:12px;width:100%;animation:fadeInUp 0.8s ease 0.6s both; }
  .countdown-unit { flex:1;border-radius:18px;padding:16px 8px;text-align:center; }
  .countdown-unit .num { font-family:'Reem Kufi Fun',sans-serif;font-size:28px;font-weight:700;color:var(--blood);text-shadow:0 0 15px var(--blood-glow);display:block; }
  .countdown-unit .lbl { font-size:11px;color:var(--bone-dim);margin-top:4px;display:block;letter-spacing:1px; }

  .creepy-msg { font-size:13px;color:rgba(168,0,0,0.6);line-height:2;font-style:italic;text-align:center;animation:fadeInUp 0.8s ease 0.7s both;padding:0 8px; }

  .retry-btn {
    padding:14px 48px;background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.06);border-radius:16px;color:var(--bone-dim);
    font-family:'Reem Kufi Fun',sans-serif;font-size:16px;cursor:pointer;
    transition:all 0.4s cubic-bezier(0.4,0,0.2,1);animation:fadeInUp 0.8s ease 0.8s both;
  }
  .retry-btn:hover { border-color:rgba(168,0,0,0.3);background:rgba(168,0,0,0.08);color:var(--bone);box-shadow:0 8px 30px rgba(168,0,0,0.1); }
  .retry-btn i { margin-left:8px; }

  /* فلاش واهتزاز */
  .flash-overlay { position:fixed;inset:0;background:radial-gradient(circle at center,rgba(168,0,0,0.4),transparent);z-index:999;pointer-events:none;opacity:0;transition:opacity 0.15s; }
  .flash-overlay.active { opacity:1; }
  @keyframes screenShake {
    0%,100%{transform:translate(0);} 10%{transform:translate(-4px,2px);} 20%{transform:translate(4px,-2px);}
    30%{transform:translate(-2px,-4px);} 40%{transform:translate(2px,4px);} 50%{transform:translate(-4px,-2px);}
    60%{transform:translate(4px,2px);} 70%{transform:translate(-2px,4px);} 80%{transform:translate(2px,-4px);}
  }
  .shake { animation:screenShake 0.5s ease; }

  .toast-glass {
    position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);
    background:rgba(168,0,0,0.12);backdrop-filter:blur(30px);border:1px solid rgba(168,0,0,0.25);
    border-radius:16px;padding:12px 24px;font-size:14px;color:var(--bone);z-index:1000;
    transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);text-align:center;max-width:90%;
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
  }
  .toast-glass.show { transform:translateX(-50%) translateY(0); }

  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  @keyframes fadeInDown { from{opacity:0;transform:translateY(-24px);} to{opacity:1;transform:translateY(0);} }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(24px);} to{opacity:1;transform:translateY(0);} }

  .particle { position:fixed;width:2px;height:2px;background:rgba(168,0,0,0.4);border-radius:50%;pointer-events:none;z-index:1;animation:particleDrift linear infinite; }
  @keyframes particleDrift { 0%{transform:translateY(100vh) translateX(0);opacity:0;} 10%{opacity:0.6;} 90%{opacity:0.3;} 100%{transform:translateY(-10vh) translateX(30px);opacity:0;} }

  @media(prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;} }
  @media(max-width:440px){ .input-card{padding:24px 18px;} .death-date-glass{padding:24px 20px;} .countdown-unit .num{font-size:22px;} .camera-container{width:240px;height:240px;} }
</style>
</head>
<body>

<div class="liquid-bg">
  <div class="liquid-orb"></div><div class="liquid-orb"></div><div class="liquid-orb"></div>
</div>
<div class="vignette"></div>
<div class="flash-overlay" id="flashOverlay"></div>
<div class="toast-glass" id="toast"></div>

<div class="app-container" id="appContainer">

  <!-- 1. شاشة الإدخال -->
  <section class="screen active" id="inputScreen">
    <header class="app-header">
      <div class="skull-orb"><i class="fas fa-skull"></i></div>
      <h1>العد التنازلي الأخير</h1>
      <p class="subtitle">أيامك معدودة</p>
    </header>
    <div class="input-card glass">
      <p class="warning-text">
        <i class="fas fa-triangle-exclamation"></i>
        تحذير: حين تعرف الحقيقة، لا طريق للعودة. الهاوية تنظر إليك.
      </p>
      <div class="form-group">
        <label><i class="fas fa-user"></i> اسمك الكامل</label>
        <input type="text" class="input-glass" id="nameInput" placeholder="اكتب اسمك إن جرأت..." autocomplete="off" maxlength="50">
      </div>
      <div class="form-group">
        <label><i class="fas fa-calendar-days"></i> تاريخ ميلادك</label>
        <input type="date" class="input-glass" id="birthInput" max="">
      </div>
      <button class="reveal-btn" onclick="goToFaceScan()">اكشف مصيري</button>
    </div>
  </section>

  <!-- 2. شاشة Face ID -->
  <section class="screen face-screen" id="faceScreen">
    <header class="app-header" style="margin-bottom:12px;">
      <h1 style="font-size:clamp(24px,6vw,36px);">تحقيق الهوية</h1>
      <p class="subtitle">الظلام لا يكذب</p>
    </header>

    <div class="camera-container" id="cameraContainer">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="faceCanvas"></canvas>
      <div class="scan-ring" id="scanRing"></div>
    </div>

    <p class="face-status" id="faceStatus">جاري تشغيل الكاميرا...</p>

    <div class="face-progress-track">
      <div class="face-progress-fill" id="faceProgress"></div>
    </div>

    <p class="face-instructions">
      <i class="fas fa-video" style="margin-left:4px;"></i>
      وجّه وجهك نحو الكاميرا حتى يتعرف عليك الظلام
    </p>

    <button class="skip-btn" onclick="skipFaceScan()">
      <i class="fas fa-forward" style="margin-left:4px;"></i> تخطي التحقق
    </button>
  </section>

  <!-- 3. شاشة التحميل -->
  <section class="screen loading-screen" id="loadingScreen">
    <div class="loading-orb"><i class="fas fa-eye"></i></div>
    <p class="face-status" id="loadingText">يتم استشارة الظلام</p>
    <div class="loading-bar-track">
      <div class="loading-bar-fill" id="loadingBar"></div>
    </div>
  </section>

  <!-- 4. شاشة النتيجة -->
  <section class="screen result-screen" id="resultScreen">
    <div class="result-icon-container"><i class="fas fa-skull-crossbones"></i></div>
    <h2 class="result-name" id="resultName"></h2>
    <p class="result-label">موعدك المحتوم</p>
    <div class="death-date-glass glass">
      <div class="date-text" id="deathDateText"></div>
    </div>
    <div class="countdown-row" id="countdownRow"></div>
    <p class="creepy-msg" id="creepyMsg"></p>
    <button class="retry-btn" onclick="resetApp()">جرّب مجدداً <i class="fas fa-rotate-left"></i></button>
  </section>

</div>

<script>
  const today = new Date();
  document.getElementById('birthInput').max = today.toISOString().split('T')[0];

  // جسيمات عائمة
  (function(){
    for(let i=0;i<12;i++){
      const p=document.createElement('div');p.className='particle';
      p.style.left=Math.random()*100+'%';
      p.style.animationDuration=(8+Math.random()*12)+'s';
      p.style.animationDelay=(Math.random()*10)+'s';
      p.style.width=p.style.height=(1+Math.random()*2)+'px';
      document.body.appendChild(p);
    }
  })();

  // === أدوات مساعدة ===
  function showToast(msg){
    const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3000);
  }
  function redFlash(){
    const f=document.getElementById('flashOverlay');f.classList.add('active');
    setTimeout(()=>f.classList.remove('active'),200);
  }
  function shakeScreen(){
    const c=document.getElementById('appContainer');c.classList.add('shake');
    setTimeout(()=>c.classList.remove('shake'),500);
  }
  function switchScreen(hideId, showId){
    document.getElementById(hideId).classList.remove('active');
    document.getElementById(showId).classList.add('active');
  }

  // === متغيرات Face ID ===
  let faceMeshInstance = null;
  let cameraInstance = null;
  let faceScanProgress = 0;
  let faceVerified = false;
  let faceAnimFrame = null;
  let savedLandmarks = null; // لحفظ معالم الوجه للمقارنة

  // رسم شبكة الوجه المرعبة على الكانفاس
  function drawFaceMesh(landmarks, ctx, w, h) {
    ctx.clearRect(0, 0, w, h);

    // خطوط الوجه (tesselation مبسطة)
    ctx.strokeStyle = 'rgba(168, 0, 0, 0.25)';
    ctx.lineWidth = 0.5;

    // رسم خطوط بين نقاط متجاورة في مناطق الوجه
    const connections = [
      // محيط الوجه
      [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109,10],
      // العين اليسرى
      [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7,33],
      // العين اليمنى
      [362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382,362],
      // الشفاه العلوية
      [61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146,61],
      // الشفاه السفلية
      [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185,61],
      // الحاجب الأيسر
      [46,53,52,65,55,107,66,105,63,70,46],
      // الحاجب الأيمن
      [276,283,282,295,285,336,296,334,293,300,276],
      // الأنف
      [168,6,197,195,5,4,1,19,94,2,168],
    ];

    connections.forEach(conn => {
      ctx.beginPath();
      for(let i=0;i<conn.length;i++){
        const pt = landmarks[conn[i]];
        if(!pt) continue;
        const x = pt.x * w, y = pt.y * h;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    });

    // رسم النقاط الحمراء المتوهجة
    landmarks.forEach((pt, i) => {
      const x = pt.x * w, y = pt.y * h;
      const size = 1.2;

      // توهج
      ctx.beginPath();
      ctx.arc(x, y, size + 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(168, 0, 0, 0.15)';
      ctx.fill();

      // نقطة
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200, 0, 0, 0.6)';
      ctx.fill();
    });

    // حلقة مسح متحركة حول الوجه
    if(!faceVerified) {
      const time = Date.now() / 1000;
      const cx = w / 2, cy = h / 2;
      const radius = Math.min(w, h) * 0.38;
      const angle = time * 2;

      ctx.beginPath();
      ctx.arc(cx, cy, radius, angle, angle + Math.PI * 0.5);
      ctx.strokeStyle = 'rgba(168, 0, 0, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // نقطة على الحلقة
      const px = cx + Math.cos(angle) * radius;
      const py = cy + Math.sin(angle) * radius;
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(168, 0, 0, 0.8)';
      ctx.fill();
    }
  }

  // تشغيل Face Mesh
  async function startFaceScan() {
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('faceCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('faceStatus');
    const progressEl = document.getElementById('faceProgress');
    const container = document.getElementById('cameraContainer');
    const ring = document.getElementById('scanRing');

    try {
      // طلب الكاميرا
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;
      await video.play();

      statusEl.textContent = 'جاري البحث عن وجهك...';
      statusEl.className = 'face-status active-status';
      container.classList.add('scanning');
      ring.classList.add('active');

      // ضبط حجم الكانفاس
      canvas.width = video.videoWidth || 480;
      canvas.height = video.videoHeight || 480;

      // تهيئة Face Mesh
      faceMeshInstance = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMeshInstance.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMeshInstance.onResults((results) => {
        if(faceVerified) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if(results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];

          // رسم شبكة الوجه
          drawFaceMesh(landmarks, ctx, canvas.width, canvas.height);

          // حفظ معالم الوجه
          savedLandmarks = landmarks.map(p => ({ x: p.x, y: p.y, z: p.z }));

          // زيادة التقدم
          faceScanProgress = Math.min(faceScanProgress + 2, 100);
          progressEl.style.width = faceScanProgress + '%';

          if(faceScanProgress < 40) {
            statusEl.textContent = 'تم اكتشاف وجه... جاري التحليل';
          } else if(faceScanProgress < 75) {
            statusEl.textContent = 'الظلام يقرأ ملامحك...';
          } else if(faceScanProgress < 100) {
            statusEl.textContent = 'تأكيد الهوية... لحظات فقط';
          }

          // اكتمل المسح
          if(faceScanProgress >= 100) {
            faceVerified = true;
            container.classList.remove('scanning');
            container.classList.add('verified');
            ring.classList.remove('active');
            ring.classList.add('verified-ring');
            statusEl.textContent = 'تم التحقق... الظلام يعرفك الآن';
            statusEl.className = 'face-status success-status';
            progressEl.classList.add('success-fill');
            progressEl.style.width = '100%';

            redFlash();

            // الانتقال لشاشة التحميل بعد ثانيتين
            setTimeout(() => {
              stopCamera();
              goToLoading();
            }, 2000);
          }

        } else {
          // لا يوجد وجه
          faceScanProgress = Math.max(faceScanProgress - 1, 0);
          progressEl.style.width = faceScanProgress + '%';
          statusEl.textContent = 'لم أرَ وجهك... وجّه نفسك نحو الكاميرا';
          statusEl.className = 'face-status active-status';
        }
      });

      // تشغيل الكاميرا مع Face Mesh
      cameraInstance = new Camera(video, {
        onFrame: async () => {
          if(faceMeshInstance && !faceVerified) {
            await faceMeshInstance.send({ image: video });
          }
        },
        width: 480,
        height: 480
      });
      cameraInstance.start();

    } catch(err) {
      console.error('Camera error:', err);
      statusEl.textContent = 'تعذر الوصول للكاميرا';
      statusEl.className = 'face-status fail-status';
      container.classList.add('failed');

      // السماح بالتخطي
      setTimeout(() => {
        statusEl.textContent = 'يمكنك تخطي هذه الخطوة';
        statusEl.className = 'face-status';
      }, 2000);
    }
  }

  // إيقاف الكاميرا
  function stopCamera() {
    const video = document.getElementById('webcam');
    if(video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
    if(cameraInstance) {
      cameraInstance.stop();
      cameraInstance = null;
    }
  }

  // الانتقال من الإدخال لمسح الوجه
  function goToFaceScan() {
    const name = document.getElementById('nameInput').value.trim();
    const birth = document.getElementById('birthInput').value;

    if(!name) { showToast('يجب أن تنطق باسمك للظلام...'); shakeScreen(); return; }
    if(!birth) { showToast('الهاوية تطلب تاريخ ميلادك...'); shakeScreen(); return; }
    if(new Date(birth) > today) { showToast('لا يمكنك أن تولد في المستقبل... بعد.'); shakeScreen(); return; }

    switchScreen('inputScreen', 'faceScreen');
    faceScanProgress = 0;
    faceVerified = false;
    startFaceScan();
  }

  // تخطي مسح الوجه
  function skipFaceScan() {
    stopCamera();
    goToLoading();
  }

  // === شاشة التحميل ===
  const loadingMessages = [
    "يتم استشارة الظلام",
    "الظلال تهمس باسمك",
    "قراءة عظام المنسيين",
    "حاصد الأرواح يحسب أيامك",
    "قبرك يُحفر الآن",
    "هل تسمع الأجراس تدق؟",
    "الموت يكتب رسالته إليك",
    "الساعة تدق ساعة رحيلك",
    "شيء ما يراقبك من الغياب",
    "العقد يُوقَّع بالدم"
  ];

  function goToLoading() {
    switchScreen('faceScreen', 'loadingScreen');

    const loadingTextEl = document.getElementById('loadingText');
    const loadingBar = document.getElementById('loadingBar');
    let msgIdx = 0, progress = 0;

    const loadInterval = setInterval(() => {
      msgIdx++;
      if(msgIdx < loadingMessages.length) loadingTextEl.textContent = loadingMessages[msgIdx];
      progress += (100 / loadingMessages.length);
      loadingBar.style.width = Math.min(progress, 95) + '%';
    }, 600);

    setTimeout(() => redFlash(), 1800);
    setTimeout(() => redFlash(), 3600);

    setTimeout(() => {
      clearInterval(loadInterval);
      loadingBar.style.width = '100%';
      setTimeout(() => showResult(), 400);
    }, 5500);
  }

  // === شاشة النتيجة ===
  const creepyMessages = [
    "توكّ... توكّ... الساعة لا تتوقف للأحياء.",
    "لا يمكنك نسيان ما كُشف لك. الظلام يعرف اسمك.",
    "كل ثانية تمر هي ثانية لن تعود. استخدمها بحكمة.",
    "نم الليلة إن استطعت. الظلال حفظت ملامحك.",
    "القبر صبور... لكنه لا ينتظر للأبد.",
    "أبوابٌ فُتحت لا تُغلق. لقد عبرت أحدها لتوّك.",
    "انظر خلفك... ليس الآن... حين تنطفئ الأضواء.",
    "العد التنازلي بدأ. أنت فقط لا تسمعه... بعد.",
    "الظلام لا ينسى من ينظر إليه.",
    "وجهك محفور في ذاكرة الهاوية إلى الأبد."
  ];

  function formatDateArabic(date) {
    const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
  }

  function calculateDeath(birthStr) {
    const birth = new Date(birthStr);
    const age = today.getFullYear() - birth.getFullYear();
    let remainingYears;
    if(age<18) remainingYears=Math.floor(Math.random()*55)+12;
    else if(age<35) remainingYears=Math.floor(Math.random()*45)+8;
    else if(age<55) remainingYears=Math.floor(Math.random()*30)+5;
    else if(age<70) remainingYears=Math.floor(Math.random()*20)+2;
    else remainingYears=Math.floor(Math.random()*12)+1;

    const deathYear=today.getFullYear()+remainingYears;
    const deathMonth=Math.floor(Math.random()*12);
    const deathDay=Math.floor(Math.random()*28)+1;
    const deathDate=new Date(deathYear,deathMonth,deathDay);

    const diffMs=deathDate-today;
    const diffDays=Math.floor(diffMs/(1000*60*60*24));
    const years=Math.floor(diffDays/365);
    const months=Math.floor((diffDays%365)/30);
    const days=diffDays%30;

    return{deathDate,remainingYears,years,months,days};
  }

  function showResult() {
    switchScreen('loadingScreen', 'resultScreen');

    const name=document.getElementById('nameInput').value.trim();
    const birth=document.getElementById('birthInput').value;
    const result=calculateDeath(birth);
    const creepyMsg=creepyMessages[Math.floor(Math.random()*creepyMessages.length)];

    document.getElementById('resultName').textContent=name;
    document.getElementById('deathDateText').textContent=formatDateArabic(result.deathDate);
    document.getElementById('creepyMsg').textContent=creepyMsg;

    const countdownRow=document.getElementById('countdownRow');
    countdownRow.innerHTML='';
    [{num:result.years,lbl:'سنة'},{num:result.months,lbl:'شهر'},{num:result.days,lbl:'يوم'}].forEach(u=>{
      const div=document.createElement('div');div.className='countdown-unit glass';
      div.innerHTML=`<span class="num">${u.num}</span><span class="lbl">${u.lbl}</span>`;
      countdownRow.appendChild(div);
    });

    redFlash();
    setTimeout(()=>shakeScreen(),200);
    setTimeout(()=>redFlash(),800);
  }

  // إعادة التطبيق
  function resetApp() {
    stopCamera();
    faceScanProgress=0;faceVerified=false;savedLandmarks=null;

    // إعادة تعيين عناصر Face ID
    const container=document.getElementById('cameraContainer');
    const ring=document.getElementById('scanRing');
    const progress=document.getElementById('faceProgress');
    container.classList.remove('scanning','verified','failed');
    ring.classList.remove('active','verified-ring');
    progress.classList.remove('success-fill');
    progress.style.width='0%';

    document.getElementById('loadingBar').style.width='0%';
    document.getElementById('nameInput').value='';
    document.getElementById('birthInput').value='';

    // إخفاء كل الشاشات وإظهار الأولى
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('inputScreen').classList.add('active');
  }

  // تفاعلات
  document.getElementById('nameInput').addEventListener('input',function(){
    if(this.value.length>0&&Math.random()>0.82) redFlash();
  });
  document.getElementById('birthInput').addEventListener('change',function(){
    if(this.value){shakeScreen();setTimeout(()=>redFlash(),300);}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&document.getElementById('inputScreen').classList.contains('active')){
      goToFaceScan();
    }
  });
</script>
